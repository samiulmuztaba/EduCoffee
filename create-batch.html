<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Batch | EduCoffee</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FDFBF7;
            --primary-coffee: #3E2723;
            --accent-caramel: #C68642;
            --text-main: #2D241E;
            --text-muted: #7D6E64;
            --card-bg: #FFFFFF;
            --border: rgba(62, 39, 35, 0.1);
            --shadow: 0 10px 40px rgba(62, 39, 35, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: var(--primary-coffee);
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 5px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .back-btn:hover { background: var(--bg-color); }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--primary-coffee);
        }

        /* Main Content */
        .container {
            max-width: 500px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        .form-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-caramel);
            background: #fff;
        }

        /* Batch Code Section */
        .code-container {
            background: rgba(198, 134, 66, 0.05);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin: 25px 0;
            border: 1px dashed var(--accent-caramel);
        }

        .code-display {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--primary-coffee);
            margin: 10px 0;
            display: block;
            text-transform: uppercase;
        }

        .btn-action-code {
            background: var(--accent-caramel);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-action-code:hover { opacity: 0.9; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: var(--primary-coffee);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-submit:hover {
            background: var(--accent-caramel);
            transform: translateY(-2px);
        }

        /* Alert Box */
        .alert {
            display: none;
            padding: 15px;
            background: #E8F5E9;
            color: #2E7D32;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
            border: 1px solid #C8E6C9;
        }

        /* Custom Selection Styles for Input */
        ::placeholder { color: #BBB; font-weight: 400; }
    </style>
</head>
<body>

    <header>
        <a href="teacher-dashboard.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
        <h1>Create New Batch</h1>
    </header>

    <div class="container">
        <div id="successAlert" class="alert">Batch successfully created! Redirecting...</div>

        <div class="form-card">
            <div class="form-group">
                <label>Batch Name</label>
                <input type="text" id="batchName" placeholder="e.g. Physics SSC 2027" required>
            </div>

            <div class="form-group">
                <label>Academic Year / Session</label>
                <input type="text" id="batchYear" placeholder="e.g. 2025-26" value="2025-26">
            </div>

            <div class="form-group">
                <label>Schedule</label>
                <input type="text" id="batchSchedule" placeholder="e.g. Sat-Mon-Wed 4PM" required>
            </div>

            <div class="code-container">
                <label style="margin-bottom: 5px; opacity: 0.7;">Unique Batch Code</label>
                <span class="code-display" id="codeDisplay">LOADING</span>
                <button type="button" class="btn-action-code" id="regenerateCodeBtn">Change Code</button>
            </div>

            <button type="button" class="btn-submit" id="saveBatchBtn">Confirm & Create Batch</button>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        let currentBatchCode = "";

        // Function to generate random alphanumeric code (No Hyphens)
        function generateRandomCode() {
            const characters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // Initialize Page
        document.addEventListener('DOMContentLoaded', () => {
            currentBatchCode = generateRandomCode();
            document.getElementById('codeDisplay').innerText = currentBatchCode;

            // Regenerate/Change Code - Can change as many times before final save
            document.getElementById('regenerateCodeBtn').addEventListener('click', () => {
                const choice = confirm("Do you want to generate a new random code or enter a custom one?\n\nOK for Random, Cancel for Custom.");
                
                if (choice) {
                    currentBatchCode = generateRandomCode();
                } else {
                    const custom = prompt("Enter custom code (4-8 chars, no spaces):", currentBatchCode);
                    if (custom && custom.trim().length >= 4) {
                        currentBatchCode = custom.replace(/\s+/g, '').toUpperCase();
                    }
                }
                document.getElementById('codeDisplay').innerText = currentBatchCode;
            });

            // Save Batch Listener
            document.getElementById('saveBatchBtn').addEventListener('click', async () => {
                const name = document.getElementById('batchName').value;
                const year = document.getElementById('batchYear').value;
                const schedule = document.getElementById('batchSchedule').value;

                if (!name || !schedule) {
                    alert("Please fill in Batch Name and Schedule.");
                    return;
                }

                // Batch Object
                const newBatch = {
                    name: name,
                    year: year,
                    schedule: schedule,
                    code: currentBatchCode,
                    teacher_id: localStorage.id
                };

                console.log(name, year, schedule, currentBatchCode, localStorage.id)

                const batchData = await CreateNewBatch(newBatch)
                console.log(batchData)
                window.location.href = 'teacher-dashboard.html'

                // Save to LocalStorage
                let batches = JSON.parse(localStorage.getItem('batches')) || [];
                batches.push(newBatch);
                localStorage.setItem('batches', JSON.stringify(batches));

                // UI Feedback
                document.getElementById('successAlert').style.display = 'block';
                document.getElementById('saveBatchBtn').disabled = true;
                document.getElementById('saveBatchBtn').style.opacity = "0.5";

                setTimeout(() => {
                    window.location.href = 'teacher-dashboard.html';
                }, 1500);
            });
        });
    </script>
</body>
</html>
