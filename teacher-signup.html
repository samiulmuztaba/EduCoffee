<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Registration | EduCoffee</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #fdfbf7;
        --primary-coffee: #3e2723;
        --accent-caramel: #c68642;
        --text-main: #2d241e;
        --text-muted: #7d6e64;
        --card-bg: #ffffff;
        --error: #d32f2f;
        --success: #388e3c;
        --shadow: 0 10px 40px rgba(62, 39, 35, 0.05);
        --transition: all 0.3s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .signup-card {
        width: 100%;
        max-width: 500px;
        background: var(--card-bg);
        padding: 40px;
        border-radius: 30px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(62, 39, 35, 0.03);
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        text-align: center;
        margin-bottom: 10px;
        color: var(--primary-coffee);
      }
      .logo span {
        color: var(--accent-caramel);
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 30px;
        color: var(--primary-coffee);
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-muted);
      }

      input {
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid rgba(62, 39, 35, 0.1);
        background: var(--bg-color);
        font-family: inherit;
        font-size: 1rem;
        transition: var(--transition);
        color: var(--text-main);
      }

      input:focus {
        outline: none;
        border-color: var(--accent-caramel);
        box-shadow: 0 0 0 4px rgba(198, 134, 66, 0.05);
      }

      /* Phone Input Style */
      .phone-input-container {
        display: flex;
        gap: 10px;
      }

      .country-code {
        width: 80px;
        background: #efebe9;
        border: 1px solid rgba(62, 39, 35, 0.1);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: var(--primary-coffee);
        font-size: 0.95rem;
      }

      .btn-submit {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        background: var(--primary-coffee);
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 10px;
      }

      .btn-submit:hover {
        background: var(--accent-caramel);
        transform: translateY(-2px);
      }

      .footer-link {
        text-align: center;
        margin-top: 25px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .footer-link a {
        color: var(--accent-caramel);
        text-decoration: none;
        font-weight: 600;
      }

      /* OTP Modal Styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(45, 36, 30, 0.6);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .otp-modal {
        background: white;
        padding: 40px;
        border-radius: 24px;
        width: 90%;
        max-width: 400px;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .otp-inputs {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 25px 0;
      }

      .otp-field {
        width: 50px;
        height: 60px;
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        border-radius: 12px;
      }

      /* Mobile Adjustments */
      @media (max-width: 480px) {
        .signup-card {
          padding: 30px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="signup-card">
      <div class="logo">Edu<span>Coffee.</span></div>
      <h1>Create Teacher Account</h1>

      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            id="teacherName"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label>Private Center Name (Optional)</label>
          <input
            type="text"
            id="centerName"
            placeholder="e.g. Success Coaching Center"
          />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="email@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <div class="phone-input-container">
            <div class="country-code">+880</div>
            <input
              type="tel"
              id="phone"
              placeholder="1XXX XXXXXX"
              maxlength="10"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a strong password"
            required
          />
        </div>

        <button type="submit" class="btn-submit">Verify & Register</button>
      </form>

      <div class="footer-link">
        Already have an account?
        <a href="auth-selection.html?role=teacher">Login</a>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="otp-modal">
        <h2>Verify Phone</h2>
        <p
          style="font-size: 0.9rem; color: var(--text-muted); margin-top: 10px"
        >
          We've sent a 4-digit code to your phone.
        </p>

        <div class="otp-inputs">
          <input
            type="text"
            class="otp-field"
            maxlength="1"
            oninput="moveNext(this, 1)"
          />
          <input
            type="text"
            class="otp-field"
            maxlength="1"
            oninput="moveNext(this, 2)"
          />
          <input
            type="text"
            class="otp-field"
            maxlength="1"
            oninput="moveNext(this, 3)"
          />
          <input
            type="text"
            class="otp-field"
            maxlength="1"
            oninput="moveNext(this, 4)"
          />
        </div>

        <button class="btn-submit" onclick="verifyOTP()">
          Confirm Registration
        </button>
        <p style="margin-top: 20px; font-size: 0.85rem">
          Didn't receive?
          <a href="#" style="color: var(--accent-caramel); font-weight: 600"
            >Resend</a
          >
        </p>
      </div>
    </div>

    <script src="api.js"></script>
    <script>
      const signupForm = document.getElementById("signupForm");
      const modalOverlay = document.getElementById("modalOverlay");
      let teacherId = null;

      signupForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const teacherData = {
          name: document.getElementById("teacherName").value,
          email: document.getElementById("email").value,
          phone: "+880" + document.getElementById("phone").value,
          password: document.getElementById("password").value,
          center_name: document.getElementById("centerName").value,
        };

        try {
          const regData = await Register(teacherData, "teacher");

          if (regData) {
            teacherId = regData.id;
            modalOverlay.style.display = "flex";
            localStorage.setItem("id", teacherId);
            console.log('ID is set to be: ', teacherId)
            window.location.href = "teacher-dashboard.html";
            alert("Registration Successful! Welcome to EduCoffee.");
          }
        } catch (error) {
          console.error("Registration error:", error);
          alert("Failed to connect to server.");
        }
      });

      function moveNext(current, nextIndex) {
        if (current.value.length >= 1) {
          const fields = document.querySelectorAll(".otp-field");
          if (fields[nextIndex]) {
            fields[nextIndex].focus();
          }
        }
      }

      function verifyOTP() {
        localStorage.setItem("id", teacherId);
        alert("Registration Successful! Welcome to EduCoffee.");
        window.location.href = "teacher-dashboard.html";
      }

      modalOverlay.addEventListener("click", (event) => {
        if (event.target === modalOverlay) {
          modalOverlay.style.display = "none";
        }
      });
    </script>
  </body>
</html>
