<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard | EduCoffee</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #fdfbf7;
        --primary-coffee: #3e2723;
        --accent-caramel: #c68642;
        --text-main: #2d241e;
        --text-muted: #7d6e64;
        --card-bg: #ffffff;
        --border-light: rgba(62, 39, 35, 0.08);
        --shadow: 0 4px 20px rgba(62, 39, 35, 0.05);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        padding-bottom: 100px;
        /* Space for mobile nav */
      }
      /* Top Header */

      header {
        background: var(--card-bg);
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: var(--shadow);
      }

      .user-profile {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: var(--accent-caramel);
        object-fit: cover;
        border: 2px solid var(--bg-color);
      }

      .user-info h2 {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--primary-coffee);
      }

      .user-info p {
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      /* Dashboard Content */

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 24px;
      }

      .welcome-section {
        margin-bottom: 32px;
      }

      .welcome-section h1 {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        color: var(--primary-coffee);
        margin-bottom: 8px;
      }
      /* Quick Stats */

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-bottom: 32px;
      }

      .stat-card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 20px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border-light);
      }

      .stat-card h3 {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .stat-card p {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary-coffee);
      }
      /* Batch List Section */

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .section-header h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.4rem;
      }

      .batch-card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 24px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border-light);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: var(--transition);
      }

      .batch-card:active {
        transform: scale(0.98);
      }

      .batch-details h3 {
        font-size: 1.1rem;
        color: var(--primary-coffee);
        margin-bottom: 4px;
      }

      .batch-details p {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .batch-code {
        background: var(--bg-color);
        padding: 8px 12px;
        border-radius: 12px;
        font-family: monospace;
        font-weight: 700;
        color: var(--accent-caramel);
        font-size: 1rem;
      }
      /* Floating Action Button (Mobile Friendly) */

      .fab {
        position: fixed;
        bottom: 80px;
        right: 20px;
        background: var(--primary-coffee);
        color: white;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(62, 39, 35, 0.3);
        cursor: pointer;
        z-index: 99;
        transition: var(--transition);
      }

      .fab:hover {
        background: var(--accent-caramel);
        transform: rotate(90deg);
      }
      /* Bottom Tab Navigation for Mobile */

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: var(--card-bg);
        display: flex;
        justify-content: space-around;
        padding: 15px 0;
        box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.05);
        border-radius: 20px 20px 0 0;
        z-index: 100;
      }

      .nav-item {
        text-align: center;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.75rem;
        flex: 1;
      }

      .nav-item.active {
        color: var(--primary-coffee);
        font-weight: 600;
      }

      .nav-item svg {
        width: 24px;
        height: 24px;
        display: block;
        margin: 0 auto 4px;
      }
      /* Empty State */

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        background: rgba(198, 134, 66, 0.03);
        border: 2px dashed var(--border-light);
        border-radius: 24px;
      }

      .empty-state p {
        color: var(--text-muted);
        margin-top: 12px;
      }
    </style>
  </head>

  <body>
    <!-- Top Header -->
    <header>
      <div class="user-profile">
        <img
          src="https://api.dicebear.com/7.x/avataaars/svg?seed=Teacher"
          alt="Avatar"
          class="avatar"
          id="profilePic"
        />
        <div class="user-info">
          <h2 id="teacherDisplay">Teacher Name</h2>
          <p id="centerDisplay">Success Coaching Center</p>
        </div>
      </div>
      <a href="profile-settings.html" style="color: var(--primary-coffee)">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1V11a2 2 0 0 1-2-2 2 2 0 0 1 2-2v-.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V15z"
          />
        </svg>
      </a>
    </header>

    <div class="container">
      <!-- Welcome Area -->
      <section class="welcome-section">
        <h1>Welcome back, Coffee!</h1>
        <p>Your students are waiting for new updates.</p>
      </section>

      <!-- Quick Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Active Batches</h3>
          <p id="totalBatches">0</p>
        </div>
        <div class="stat-card">
          <h3>Total Students</h3>
          <p id="totalStudents">0</p>
        </div>
      </div>

      <!-- My Batches Section -->
      <div class="section-header">
        <h2>Your Batches</h2>
        <a
          href="create-batch.html"
          style="
            color: var(--accent-caramel);
            font-size: 0.9rem;
            text-decoration: none;
            font-weight: 600;
          "
          >+ Add New</a
        >
      </div>

      <div id="batchList">
        <!-- Dynamic Content -->
        <div class="empty-state">
          <div style="font-size: 3rem">☕</div>
          <p>
            No batches found. Create your first batch to start adding students.
          </p>
        </div>
      </div>
    </div>

    <!-- Floating Action Button -->
    <div class="fab" onclick="window.location.href = 'create-batch.html'">
      <svg
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="white"
        stroke-width="3"
        stroke-linecap="round"
      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="teacher-dashboard.html" class="nav-item active">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Home
      </a>
      <a href="post-notice.html" class="nav-item">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        Notices
      </a>
      <a href="upload-result.html" class="nav-item">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
        Results
      </a>
      <a href="profile-settings.html" class="nav-item">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        Profile
      </a>
    </div>

    <script src="api.js"></script>
    <script>
      if (!localStorage.id) {
        alert("Please login first");
        window.location.href = "index.html";
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const id = localStorage.getItem("id");

        if (!id) {
          alert("Please login first");
          window.location.href = "index.html";
          return;
        }

        const teacher = await GetUserByID(id);

        console.log("teacher =", teacher);

        if (!teacher || teacher.detail) {
          console.error("User not found or API error");
          alert("User not found. Make sure you've registered");
          return;
        }

        const batches = await GetBatchesByTID(teacher.id)
        console.log(batches)
        
        const myStudents = await GetMyStudents(teacher.id)
        console.log(myStudents)

        document.getElementById('totalBatches').innerText = batches.length
        document.getElementById('totalStudents').innerText = myStudents.length

        document.getElementById("teacherDisplay").innerText = teacher.name;
        document.getElementById("centerDisplay").innerText =
          teacher.center_name || "";
      });
    </script>
  </body>
</html>
