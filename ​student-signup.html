<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | EduCoffee</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FDFBF7;
            --primary-coffee: #3E2723;
            --accent-caramel: #C68642;
            --text-main: #2D241E;
            --text-muted: #7D6E64;
            --card-bg: #FFFFFF;
            --error: #D32F2F;
            --border-light: rgba(62, 39, 35, 0.08);
            --shadow: 0 10px 40px rgba(62, 39, 35, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-coffee);
            margin-bottom: 8px;
        }
        .logo span { color: var(--accent-caramel); }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .signup-card {
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border-light);
            background: var(--bg-color);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--accent-caramel);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(198, 134, 66, 0.05);
        }

        /* Batch Code Style */
        .batch-input {
            text-transform: uppercase;
            font-family: monospace;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 1.1rem;
            color: var(--primary-coffee);
            background: rgba(198, 134, 66, 0.05);
            border: 1px dashed var(--accent-caramel);
        }

        .phone-row {
            display: flex;
            gap: 10px;
        }

        .country-tag {
            padding: 14px;
            background: #EFEBE9;
            border-radius: 14px;
            font-weight: 600;
            color: var(--primary-coffee);
            display: flex;
            align-items: center;
        }

        /* Password Group Container */
        .password-section {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
        }

        .password-section label {
            color: var(--primary-coffee);
        }

        .password-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.75rem;
            margin-top: 6px;
            display: none;
            font-weight: 500;
        }

        .btn-signup {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: var(--primary-coffee);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-signup:hover {
            background: var(--accent-caramel);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(198, 134, 66, 0.2);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--accent-caramel);
            text-decoration: none;
            font-weight: 600;
        }

        /* Success State Overlay */
        .success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        .check-icon {
            width: 70px; height: 70px;
            background: #E8F5E9;
            color: #2E7D32;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 20px;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .signup-card { padding: 25px 20px; }
            .password-row { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="brand-header">
            <div class="logo">Edu<span>Coffee.</span></div>
            <p>Join your batch & start learning</p>
        </div>

        <div class="signup-card">
            <form id="studentSignupForm">
                
                <!-- Batch Code -->
                <div class="form-group">
                    <label>Enter Batch Code</label>
                    <input type="text" id="batchCode" class="batch-input" placeholder="e.g. TEACHER2025" required>
                    <p class="info-note" style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">Enter the exact code provided by your teacher.</p>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="studentName" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="studentEmail" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="phone-row">
                        <div class="country-tag">+880</div>
                        <input type="tel" id="phone" placeholder="1XXXXXXXXX" pattern="[0-9]{10,11}" required title="Please enter 10 or 11 digit valid number">
                    </div>
                </div>

                <!-- Grouped Password Section -->
                <div class="password-section">
                    <div class="password-row">
                        <div>
                            <label>Create Password</label>
                            <input type="password" id="password" placeholder="Min. 6 chars" minlength="6" required>
                        </div>
                        <div>
                            <label>Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="Retype password" minlength="6" required>
                        </div>
                    </div>
                    <p id="passwordError" class="error-msg">Passwords do not match. Please try again.</p>
                </div>

                <button type="submit" class="btn-signup">
                    Create Student Account
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>
        </div>

        <div class="footer-text">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
        <div class="check-icon">✓</div>
        <h1 style="font-family: 'Playfair Display', serif; color: var(--primary-coffee);">Welcome Aboard!</h1>
        <p style="color: var(--text-muted); margin: 10px 0 30px; max-width: 300px;">Your registration is successful. Start your journey now.</p>
        <button class="btn-signup" style="width: auto; padding: 12px 40px;" onclick="window.location.href='student-dashboard.html'">Go to Dashboard</button>
    </div>

    <script>
        const signupForm = document.getElementById('studentSignupForm');
        const successOverlay = document.getElementById('successOverlay');
        const batchInput = document.getElementById('batchCode');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordError = document.getElementById('passwordError');

        // Clean Batch Code Input (No spaces, Uppercase only)
        batchInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/\s/g, '');
        });

        // Hide error when typing again
        confirmPasswordInput.addEventListener('input', () => {
            passwordError.style.display = 'none';
        });

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const batchCode = batchInput.value;
            const studentName = document.getElementById('studentName').value;
            const studentEmail = document.getElementById('studentEmail').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = confirmPasswordInput.value;

            // Check if passwords match
            if(password !== confirmPassword) {
                passwordError.style.display = 'block';
                return;
            }

            // Mock saving logic
            localStorage.setItem('studentName', studentName);
            localStorage.setItem('studentEmail', studentEmail);
            localStorage.setItem('studentPhone', '+880' + phone);
            localStorage.setItem('joinedBatch', batchCode);
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', 'student');

            // Show Success Overlay
            successOverlay.style.display = 'flex';
        });
    </script>
</body>
</html>
