<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started | EduCoffee</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #583d06;
            --primary-coffee: #3E2723;
            --accent-caramel: #C68642;
            --text-main: #2D241E;
            --text-muted: #7D6E64;
            --card-bg: #FFFFFF;
            --shadow: 0 10px 40px rgba(62, 39, 35, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid rgba(62, 39, 35, 0.03);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--primary-coffee);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-coffee);
            margin-bottom: 10px;
        }

        .logo span { color: var(--accent-caramel); }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--primary-coffee);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .role-indicator {
            display: inline-block;
            padding: 6px 16px;
            background: var(--bg-color);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-caramel);
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary-coffee);
            color: #fff;
            border: 1px solid var(--primary-coffee);
        }

        .btn-primary:hover {
            background: var(--accent-caramel);
            border-color: var(--accent-caramel);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary-coffee);
            border: 1px solid rgba(62, 39, 35, 0.2);
        }

        .btn-outline:hover {
            background: var(--bg-color);
            border-color: var(--primary-coffee);
        }

        .footer-note {
            margin-top: 35px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .auth-container {
                padding: 40px 25px;
            }
            .back-home {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
    </a>

    <div class="auth-container">
        <div class="logo">Edu<span>Coffee.</span></div>
        <div id="roleBadge" class="role-indicator">Portal Access</div>
        <h1 id="selectionTitle">Welcome Back</h1>
        <p class="subtitle" id="selectionSubtitle">Please select your preferred action to continue your journey.</p>

        <div class="btn-group">
            <a href="#" id="loginBtn" class="btn btn-primary">Login to Account</a>
            <a href="#" id="signupBtn" class="btn btn-outline">Create New Account</a>
        </div>

        <p class="footer-note">Securely managing your academic data.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');

            const badge = document.getElementById('roleBadge');
            const loginBtn = document.getElementById('loginBtn');
            const signupBtn = document.getElementById('signupBtn');
            const title = document.getElementById('selectionTitle');

            if (role === 'teacher') {
                badge.innerText = "Teacher Portal";
                title.innerText = "Teacher Access";
                loginBtn.href = "teacher-login.html";
                signupBtn.href = "teacher-signup.html";
            } else if (role === 'student') {
                badge.innerText = "Student Portal";
                title.innerText = "Student Access";
                loginBtn.href = "student-login.html";
                signupBtn.href = "student-signup.html";
            } else {
                badge.innerText = "Portal Access";
            }
        });
    </script>
</body>
</html>
