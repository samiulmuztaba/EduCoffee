<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | EduCoffee</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #fdfbf7;
        --primary-coffee: #3e2723;
        --accent-caramel: #c68642;
        --text-main: #2d241e;
        --text-muted: #7d6e64;
        --card-bg: #ffffff;
        --border-light: rgba(62, 39, 35, 0.08);
        --shadow: 0 10px 40px rgba(62, 39, 35, 0.05);
        --transition: all 0.3s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 400px;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand-logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .brand-logo h1 {
        font-family: "Playfair Display", serif;
        font-size: 2.2rem;
        color: var(--primary-coffee);
      }

      .brand-logo p {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-top: 5px;
      }

      .login-card {
        background: var(--card-bg);
        padding: 35px;
        border-radius: 28px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border-light);
      }

      /* Role Switcher */
      .role-switcher {
        display: flex;
        background: var(--bg-color);
        padding: 5px;
        border-radius: 14px;
        margin-bottom: 25px;
        border: 1px solid var(--border-light);
      }

      .role-btn {
        flex: 1;
        padding: 10px;
        border: none;
        background: transparent;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-muted);
        cursor: pointer;
        border-radius: 10px;
        transition: var(--transition);
      }

      .role-btn.active {
        background: var(--primary-coffee);
        color: white;
      }

      /* Form Styling */
      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-muted);
      }

      input {
        width: 100%;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid var(--border-light);
        background: var(--bg-color);
        font-family: inherit;
        font-size: 1rem;
        color: var(--text-main);
        transition: var(--transition);
      }

      input:focus {
        outline: none;
        border-color: var(--accent-caramel);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(198, 134, 66, 0.1);
      }

      .forgot-pass {
        text-align: right;
        margin-top: -15px;
        margin-bottom: 20px;
      }

      .forgot-pass a {
        font-size: 0.8rem;
        color: var(--accent-caramel);
        text-decoration: none;
        font-weight: 500;
      }

      .btn-login {
        width: 100%;
        padding: 16px;
        background: var(--primary-coffee);
        color: white;
        border: none;
        border-radius: 16px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn-login:hover {
        background: var(--accent-caramel);
        transform: translateY(-2px);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .footer-links {
        text-align: center;
        margin-top: 25px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .footer-links a {
        color: var(--accent-caramel);
        text-decoration: none;
        font-weight: 600;
      }

      /* Loading Spinner */
      .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="brand-logo">
        <h1>EduCoffee</h1>
        <p>Welcome back! Please login to your account.</p>
      </div>

      <div class="login-card">
        <!-- Switch between Student and Teacher -->
        <div class="role-switcher">
          <button class="role-btn active" onclick="setRole('student', this)">
            Student
          </button>
          <button class="role-btn" onclick="setRole('teacher', this)">
            Teacher
          </button>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="example@mail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>

          <div class="forgot-pass">
            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span id="btnText">Login to Account</span>
            <div class="spinner" id="btnSpinner"></div>
          </button>
        </form>
      </div>

      <div class="footer-links">
        Don't have an account?
        <a href="student-signup.html" id="signupLink">Sign Up</a>
      </div>
    </div>

    <script src="api.js"></script>
    <script>
      let currentRole = "student";

      function setRole(role, btn) {
        currentRole = role;
        // Update UI
        document
          .querySelectorAll(".role-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        // Update Link
        const signupLink = document.getElementById("signupLink");
        if (role === "teacher") {
          signupLink.innerText = "Apply for Teacher Portal";
          signupLink.href = "#"; // Replace with teacher application page
        } else {
          signupLink.innerText = "Sign Up";
          signupLink.href = "student-signup.html";
        }
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const pass = document.getElementById("password").value;
          const btnText = document.getElementById("btnText");
          const spinner = document.getElementById("btnSpinner");
          const loginBtn = document.getElementById("loginBtn");

          try {
            console.log('inside the try block')
            const logData = await Login(email, pass);
            console.log(logData);
            localStorage.setItem('id', logData.id)
            console.log(localStorage.id)
          } catch (err) {}

          // Show Loading
          btnText.style.display = "none";
          spinner.style.display = "block";
          loginBtn.disabled = true;
          loginBtn.style.opacity = "0.8";

          // Mock Login Logic
          setTimeout(() => {
            // Store session
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userRole", currentRole);

            // Redirect based on role
            if (currentRole === "teacher") {
              window.location.href = "teacher-dashboard.html";
            } else {
              window.location.href = "student-dashboard.html";
            }
          }, 1500);
        });
    </script>
  </body>
</html>
